# Publish the app on GitHub Pages (project site: https://<user>.github.io/<repo>/).
#
# The site is a plain static build, so the whole pipeline is: test -> build
# dist-pages -> upload it as a Pages artifact -> deploy it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels the queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Validate the Spanish dictionary and its search index
        run: |
          npm run data:dict-es
          # The committed data must equal what the scripts produce: the scripts
          # run in CI (a repair before validating), so this is the only guard
          # that the shipped files are not stale. Use `git status --porcelain`
          # (not `git diff`) so an uncommitted new file fails the build too.
          test -z "$(git status --porcelain public/data)" || { git status --porcelain public/data; exit 1; }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site (OUT_DIR=dist-pages)
        run: sh scripts/build-pages.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
