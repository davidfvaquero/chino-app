<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="preload" href="./fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- Title and every other visible string are set from src/locales/*.json (see src/i18n.js). -->
    <title></title>
  </head>
  <body>
    <div class="app">
      <header id="app-header" class="app-header"></header>
      <main id="screen" class="screen" tabindex="-1"></main>
      <nav id="app-nav" class="tabbar"></nav>
      <div id="app-status" class="status" hidden></div>
    </div>
    <script type="module" src="./src/main.js"></script>

</html>
